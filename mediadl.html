<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HLS Grabber - 保存</title>
<link rel="stylesheet" href="ui.css">
<style>
  body { font-size: 14px; min-height: 100vh; display: grid; place-items: center; padding: 20px; }
  .card { width: min(560px, 100%); padding: 28px; display: grid; gap: 16px; }
  h1 { font-size: 18px; margin: 0; letter-spacing: -.01em; }
  #status { font-weight: 600; }
  #status .ok { display: inline-flex; align-items: center; gap: 8px; }
  #status .ok::before {
    content: "✓"; display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%;
    background: var(--ok-soft); color: var(--ok); font-size: 13px;
  }
  .detail { font-family: var(--mono); font-size: 11px; color: var(--faint); word-break: break-all; }
  .detail:empty { display: none; }
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 20h14"/></svg></span>
    <h1>動画を保存しています</h1>
  </div>
  <div id="status">準備中…</div>
  <div class="bar"><div id="bar"></div></div>
  <div id="error" class="err"></div>
  <div class="detail" id="detail"></div>
</div>
<script type="module" src="mediadl.js"></script>
</body>
</html>
