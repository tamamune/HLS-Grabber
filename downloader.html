<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>HLS Grabber</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font: 14px system-ui, sans-serif; background: #17181b; color: #e6e6e6; }
  main { max-width: 760px; margin: 32px auto; padding: 0 20px; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  section { background: #222429; border-radius: 10px; padding: 16px 18px; margin-bottom: 16px; }
  h2 { font-size: 14px; margin: 0 0 10px; color: #aab; font-weight: 600; }
  .src { word-break: break-all; font-size: 12px; color: #889; }
  label.opt { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 6px; cursor: pointer; }
  label.opt:hover { background: #2c2f36; }
  .sub { color: #889; font-size: 12px; }
  .note { color: #f0b429; font-size: 12px; margin-top: 8px; }
  input[type=text], input[type=number] { background: #15161a; color: #eee; border: 1px solid #3a3d44; border-radius: 6px; padding: 7px 9px; font-size: 14px; }
  input[type=text] { width: 100%; box-sizing: border-box; }
  input[type=number] { width: 64px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  button { background: #3a3d44; color: #eee; border: 0; border-radius: 6px; padding: 9px 16px; cursor: pointer; font-size: 14px; }
  button:hover:not(:disabled) { background: #4a4e57; }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: #e53935; }
  button.primary:hover:not(:disabled) { background: #f4511e; }
  .bar { height: 10px; background: #15161a; border-radius: 5px; overflow: hidden; margin: 12px 0; }
  .bar > div { height: 100%; width: 0; background: linear-gradient(90deg, #e53935, #ff7043); transition: width .2s; }
  .bar.live > div { width: 100% !important; animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .45; } }
  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
  .stats div { background: #1a1b1f; border-radius: 6px; padding: 8px 10px; }
  .stats b { display: block; font-size: 16px; margin-top: 2px; }
  #status { font-weight: 600; }
  .err { color: #ff6b6b; }
  .ok { color: #66bb6a; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>HLS Grabber</h1>

  <section>
    <h2>ソース</h2>
    <div class="src" id="src"></div>
    <div id="info" class="sub" style="margin-top:8px"></div>
  </section>

  <section id="pick" hidden>
    <h2>画質 / トラック</h2>
    <div id="options"></div>
    <div id="audioNote" class="note" hidden>※ 選んだ画質は音声が別トラックです。音声は「音声」を選んで別ファイルとして保存してください。</div>
  </section>

  <section id="settings" hidden>
    <h2>保存設定</h2>
    <div class="row" style="margin-bottom:10px">
      <input type="text" id="name" placeholder="ファイル名">
    </div>
    <div class="row">
      <span class="sub">同時接続数</span><input type="number" id="conc" value="6" min="1" max="16">
      <span style="flex:1"></span>
      <button class="primary" id="start">ダウンロード開始</button>
    </div>
  </section>

  <section id="progress" hidden>
    <h2>進行状況</h2>
    <div id="status">準備中…</div>
    <div class="bar" id="bar"><div></div></div>
    <div class="stats">
      <div><span class="sub">セグメント</span><b id="sSeg">0</b></div>
      <div><span class="sub">サイズ</span><b id="sSize">0 MB</b></div>
      <div><span class="sub">速度</span><b id="sSpeed">-</b></div>
      <div><span class="sub">長さ</span><b id="sDur">0:00</b></div>
      <div><span class="sub">失敗</span><b id="sFail">0</b></div>
    </div>
    <div class="row" style="margin-top:14px">
      <button class="primary" id="stop">停止して保存</button>
      <button id="cancel">中止（保存しない）</button>
    </div>
  </section>

  <div id="error" class="err"></div>
</main>
<script type="module" src="downloader.js"></script>
</body>
</html>
